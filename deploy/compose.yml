# Bevisfangstens korningsmiljo pa den alltid pasatta varden. Se deploy/README.md.
#
# Inga vardsokvagar och inga vardspecifika id:n star i den har filen. De kommer
# ur .env bredvid den, som aldrig committas (se .env.exempel). Containerns INRE
# sokvagar ar fasta.
#
# Tva roller, tva monteringar:
#   uppdatera  drar koden. Repot skrivbart, ingen data, ingen nyckel.
#   kedja      kor koden. Repot SKRIVSKYDDAT, datan skrivbar.
# Den som kor matningen kan inte rora instrumentet som utfor den - varken en
# bugg eller en komprometterad korning.
#
# Ingen tjanst gor nagot nar projektet startas. Imagen saknar standardkorning,
# och uppdatera ligger i en profil som bara kors nar den namns:
#   docker compose run --rm uppdatera
#   docker compose run --rm kedja python -m <steg> ...

x-bas: &bas
  image: 600-states-kedja:lokal
  init: true
  restart: "no"
  # En egen anvandare pa varden med atkomst enbart till kedjans mapp - inte en
  # administrator. Kedjan hamtar och parsar tusentals sidor fran frammande
  # domaner; den ska ha minsta mojliga behorighet.
  user: "${KEDJA_UID:?KEDJA_UID saknas - se deploy/.env.exempel}:${KEDJA_GID:?KEDJA_GID saknas - se deploy/.env.exempel}"
  read_only: true
  tmpfs:
    - /tmp
  working_dir: /srv/repo

services:
  kedja:
    <<: *bas
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      # Balte och hangslen, inte mekanismen. Kedjan laser KORNING_START_UTC sjalv
      # och raknar dygnet i UTC; den ska stanna av egen kraft aven om TZ ar fel.
      TZ: UTC
      STATES_DATA: /srv/data
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      # Nyckeln kommer ur .env vid start. Aldrig i imagen, aldrig i ett lager,
      # aldrig i repot.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ${REPO_DIR:?REPO_DIR saknas - se deploy/.env.exempel}:/srv/repo:ro
      - ${DATA_DIR:?DATA_DIR saknas - se deploy/.env.exempel}:/srv/data

  # Stamplingen. EGEN IMAGE, egen lasfil - se deploy/stampel.Dockerfile. Den
  # delar bara anvandare och monteringar med kedjan; de nio Bitcoin- och
  # git-biblioteken finns inte i kedjans image och ska inte finnas dar.
  #
  # Repot ar skrivskyddat och datan skrivbar, som for kedjan: stampeln skriver
  # .ots-filen och sin post bredvid manifestet, aldrig i koden.
  #
  #   docker compose run --rm stampel python src/stamp.py stampla
  #   docker compose run --rm stampel python src/stamp.py forankra
  stampel:
    <<: *bas
    image: 600-states-stampel:lokal
    build:
      context: ..
      dockerfile: deploy/stampel.Dockerfile
    environment:
      TZ: UTC
      STATES_DATA: /srv/data
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${REPO_DIR:?REPO_DIR saknas - se deploy/.env.exempel}:/srv/repo:ro
      - ${DATA_DIR:?DATA_DIR saknas - se deploy/.env.exempel}:/srv/data

  # Signeringen. SAMMA IMAGE SOM STAMPELN, egen tjanst - och skalet ar nyckeln.
  # Stamplingen behover ingen privat nyckel, sa den ska inte ha en monterad:
  # den enda korning som ser nyckeln ar den som signerar. Minsta mojliga
  # behorighet, samma regel som ger kedjan en egen anvandare.
  #
  # Nyckelfilen monteras SKRIVSKYDDAT pa en fast inre sokvag, och koden nar den
  # bara genom STATES_SIGN_KEY. Programmet oppnar den aldrig och skriver aldrig
  # ut dess sokvag - se src/sign.py.
  #
  #   docker compose run --rm signatur python src/sign.py signera
  signatur:
    <<: *bas
    image: 600-states-stampel:lokal
    build:
      context: ..
      dockerfile: deploy/stampel.Dockerfile
    environment:
      TZ: UTC
      STATES_DATA: /srv/data
      STATES_SIGN_KEY: /run/nyckel/signering.key
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${REPO_DIR:?REPO_DIR saknas - se deploy/.env.exempel}:/srv/repo:ro
      - ${DATA_DIR:?DATA_DIR saknas - se deploy/.env.exempel}:/srv/data
      - ${SIGN_KEY_FILE:?SIGN_KEY_FILE saknas - se deploy/.env.exempel}:/run/nyckel/signering.key:ro

  uppdatera:
    <<: *bas
    profiles: ["uppdatera"]
    environment:
      TZ: UTC
      HOME: /tmp
    volumes:
      - ${REPO_DIR:?REPO_DIR saknas - se deploy/.env.exempel}:/srv/repo
    command: ["git", "-C", "/srv/repo", "pull", "--ff-only"]
